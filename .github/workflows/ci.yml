name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 基本檢查：與 Vercel 相同，直接在 Node 22 + pnpm 上執行（不使用 Docker）
  checks:
    name: install / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # 版本取自 package.json 的 packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Engine coverage (T11：lines ≥ 90%)
        run: pnpm --filter @mining/game-engine coverage
      - name: Engine determinism (Node vs fixture)
        run: node packages/game-engine/test/golden-cli.ts | diff -u packages/game-engine/test/fixtures/golden-v1.json -
      - name: Balance simulator smoke run (shared engine)
        run: node scripts/balance-sim.ts --runs 20 --only profiles
      - name: Settlement benchmark (12h offline worst case, Node)
        run: node packages/game-engine/bench/settle-bench.ts
      - run: pnpm build
      - name: Client bundle contains no server secrets
        run: |
          set -e
          if grep -rlE "SUPABASE_SERVICE_ROLE_KEY|SERVICE_ROLE_KEY|rng_secret|player_secrets" apps/web/.next/static; then
            echo "server-only identifiers found in the browser bundle"; exit 1
          fi
          echo "ok: no server-only identifiers in apps/web/.next/static"

  # Edge Function 以 Deno 型別檢查（含匯入 supabase/ 以外的 packages/）；
  # 引擎在 Deno 上的確定性快照必須與 Node（Vitest）使用的 fixture 完全相同
  edge-function:
    name: deno check (Edge Functions) / engine determinism
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/health/deno.json supabase/functions/health/index.ts
      - run: deno check --config supabase/functions/character-create/deno.json supabase/functions/character-create/index.ts
      - run: deno check --config supabase/functions/game-state/deno.json supabase/functions/game-state/index.ts
      - run: deno check --config supabase/functions/game-action/deno.json supabase/functions/game-action/index.ts
      - name: Edge request body limit (bounded streaming read)
        run: deno test --no-config supabase/functions/_shared/body_test.ts
      - run: deno check --config packages/game-engine/deno.test.json packages/game-engine/src/index.ts packages/game-engine/test/golden-cli.ts packages/game-engine/bench/settle-bench.ts
      - name: Engine determinism (Deno vs fixture)
        run: deno run --config packages/game-engine/deno.test.json packages/game-engine/test/golden-cli.ts | diff -u packages/game-engine/test/fixtures/golden-v1.json -
      - name: Settlement benchmark (12h offline worst case, Deno)
        run: deno run --config packages/game-engine/deno.test.json packages/game-engine/bench/settle-bench.ts

  # Docker-first 整合驗收：依 README 的步驟，在 Linux runner 上以開發容器啟動 Supabase Local。
  # 這驗證的是 Linux + Docker Engine，不代表 Docker Desktop（macOS / Windows）。
  docker-integration:
    name: docker integration (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env
        run: cp .env.example .env
      - name: Build dev container
        run: docker compose build
      - name: pnpm install (in dev container)
        run: docker compose run --rm -T dev pnpm install --frozen-lockfile
      - name: typecheck + unit tests (in dev container)
        run: docker compose run --rm -T dev sh -c "pnpm typecheck && pnpm test"
      - name: Create networks (supabase network binds published ports to 127.0.0.1)
        run: docker compose up --no-start web
      - name: supabase start (in dev container, via Docker socket)
        run: docker compose run --rm -T dev pnpm supabase:start
      - name: env:sync
        run: docker compose run --rm -T dev pnpm env:sync
      - name: Start web (next dev)
        run: docker compose up -d web
      - name: Wait for web
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then echo "web ready after ${i}x2s"; exit 0; fi
            sleep 2
          done
          echo "web not ready"; exit 1
      - name: verify:env
        run: docker compose run --rm -T dev pnpm verify:env
      - name: verify:hot-reload
        run: docker compose run --rm -T dev pnpm verify:hot-reload
      - name: Migrations rebuild from a clean database (supabase db reset)
        run: docker compose run --rm -T dev supabase db reset
      - name: Integration tests (real Supabase Local — RLS / RPC / Auth / idempotency / concurrency)
        run: docker compose run --rm -T dev pnpm test:integration
      - name: E2E (Playwright in Docker — browser → Next.js dev → Supabase Local Auth / Edge Functions / Postgres)
        run: |
          docker run --rm --network host --ipc=host \
            -v "$PWD:$PWD" -w "$PWD/tests/e2e" \
            -e E2E_SCREENSHOT_DIR=screenshots -e CI=1 \
            mcr.microsoft.com/playwright:v1.65.1-noble \
            npx playwright test
      - name: Production build E2E (next build + next start, same Playwright suite)
        run: |
          docker compose stop web   # next dev 與 next build 共用 apps/web/.next，先停止開發伺服器
          docker compose run -d --name web-prod -T dev sh -c "pnpm --filter @mining/web build && pnpm --filter @mining/web exec next start -H 127.0.0.1 -p 3001"
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3001/login >/dev/null 2>&1; then echo "production web ready after ${i}x3s"; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' web-prod 2>/dev/null)" != "true" ]; then docker logs web-prod; exit 1; fi
            sleep 3
          done
          curl -fsS http://127.0.0.1:3001/login >/dev/null
          # 正式 build 不得提供開發用頁面
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/dev/preview)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/dev)" = "404"
          docker run --rm --network host --ipc=host \
            -v "$PWD:$PWD" -w "$PWD/tests/e2e" \
            -e E2E_BASE_URL=http://127.0.0.1:3001 -e E2E_SCREENSHOT_DIR=screenshots-prod -e CI=1 \
            mcr.microsoft.com/playwright:v1.65.1-noble \
            npx playwright test --output=test-results-prod
      - name: Stop production web
        if: always()
        run: docker rm -f web-prod || true
      - name: Print E2E screenshots (base64, for reviewers without artifact access)
        if: always()
        run: |
          for f in tests/e2e/screenshots/*.png; do
            [ -f "$f" ] || continue
            echo "E2E_SHOT_BEGIN $(basename "$f")"
            base64 -w 0 "$f" | fold -w 4000
            echo
            echo "E2E_SHOT_END"
          done
      - name: Upload E2E screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            tests/e2e/screenshots/
            tests/e2e/screenshots-prod/
            tests/e2e/playwright-report/
            tests/e2e/test-results/
            tests/e2e/test-results-prod/
          if-no-files-found: ignore
      - name: Edge Runtime resource events (CPU / memory, if logged)
        if: always()
        run: docker logs supabase_edge_runtime_mining-expedition 2>&1 | grep -iE "cpu|memory|shutdown|worker" | tail -40 || true
      - name: diagnose
        if: always()
        run: docker compose run --rm -T dev pnpm diagnose
      - name: Stop
        if: always()
        run: |
          docker compose run --rm -T dev supabase stop --no-backup || true
          docker compose down -v || true
