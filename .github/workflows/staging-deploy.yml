# Staging 部署（Supabase Cloud Staging：migration → 驗證 → Edge Functions → Smoke）
#
# 安全設計（docs/DEPLOYMENT_STAGING.md §6）：
# - 只能手動觸發（workflow_dispatch），而且只部署 main；PR 與 fork 的程式碼拿不到任何部署密鑰。
# - 使用 GitHub Environment `staging`：密鑰只在這個 environment；請在 Settings → Environments 設定
#   Required reviewers（人工批准）與 Deployment branches = main。
# - 輸入的 project ref 必須與 environment 變數 STAGING_PROJECT_REF 相同，且不得等於 PRODUCTION_PROJECT_REF。
# - 不執行 db reset；migration 先 dry-run 再套用；任何一步失敗就停止，摘要逐步列出結果（不把部分成功顯示為成功）。
# - 不部署 Production；Vercel Preview 由 Vercel 的 Git 整合自動建立，不在這裡部署。
name: Staging deploy

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: "再輸入一次 Staging 的 Supabase project ref（必須與 environment 變數 STAGING_PROJECT_REF 相同）"
        required: true
        type: string
      apply_migrations:
        description: "套用 migration（先 dry-run）"
        type: boolean
        default: true
      deploy_functions:
        description: "部署 Edge Functions（character-create、game-state、game-action、health）"
        type: boolean
        default: true
      run_smoke:
        description: "執行 Cloud Smoke Test（API + 瀏覽器）"
        type: boolean
        default: true
      smoke_rate_limit:
        description: "Smoke 包含限流檢查（最多 30 個唯讀請求）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: staging
    env:
      STAGING_PROJECT_REF: ${{ vars.STAGING_PROJECT_REF }}
      PRODUCTION_PROJECT_REF: ${{ vars.PRODUCTION_PROJECT_REF }}
      CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Pre-flight checks (typecheck + unit tests)
        id: preflight
        run: pnpm typecheck && pnpm test

      - name: Guard target project (before any remote call)
        id: guard
        run: node scripts/staging/guard.ts

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Link staging project
        id: link
        run: |
          supabase link --project-ref "$STAGING_PROJECT_REF"
          node scripts/staging/guard.ts   # 連結後再檢查一次 supabase/.temp/project-ref

      - name: Migration history (remote vs local)
        id: history
        run: supabase migration list --linked

      - name: Migrations dry-run
        id: dryrun
        if: inputs.apply_migrations
        run: supabase db push --linked --dry-run

      - name: Apply migrations (no reset)
        id: migrate
        if: inputs.apply_migrations
        run: supabase db push --linked

      - name: Verify schema / RLS / RPC permissions / cron (read-only)
        id: verify
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/ops/verify-staging.sql

      - name: Edge Function secrets (CORS allowlist, rate limits)
        id: secrets
        if: inputs.deploy_functions
        env:
          GAME_API_ALLOWED_ORIGIN: ${{ vars.STAGING_ALLOWED_ORIGINS }}
        run: |
          test -n "$GAME_API_ALLOWED_ORIGIN" || { echo "STAGING_ALLOWED_ORIGINS is required for staging (no wildcard CORS)"; exit 1; }
          supabase secrets set --project-ref "$STAGING_PROJECT_REF" GAME_API_ALLOWED_ORIGIN="$GAME_API_ALLOWED_ORIGIN"

      - name: Deploy Edge Functions
        id: functions
        if: inputs.deploy_functions
        run: supabase functions deploy health character-create game-state game-action --project-ref "$STAGING_PROJECT_REF"

      - name: API smoke test
        id: smoke_api
        if: inputs.run_smoke
        env:
          STAGING_SMOKE: "1"
          SMOKE_RATE_LIMIT: ${{ inputs.smoke_rate_limit && '1' || '0' }}
          STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
          STAGING_WEB_ORIGIN: ${{ vars.STAGING_WEB_ORIGIN }}
          SMOKE_USER_A_EMAIL: ${{ secrets.SMOKE_USER_A_EMAIL }}
          SMOKE_USER_A_PASSWORD: ${{ secrets.SMOKE_USER_A_PASSWORD }}
          SMOKE_USER_B_EMAIL: ${{ secrets.SMOKE_USER_B_EMAIL }}
          SMOKE_USER_B_PASSWORD: ${{ secrets.SMOKE_USER_B_PASSWORD }}
        run: pnpm --filter @mining/integration-tests exec vitest run staging-smoke.test.ts

      - name: Browser smoke test (desktop + mobile)
        id: smoke_web
        if: inputs.run_smoke
        env:
          STAGING_WEB_URL: ${{ vars.STAGING_WEB_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SMOKE_USER_A_EMAIL: ${{ secrets.SMOKE_USER_A_EMAIL }}
          SMOKE_USER_A_PASSWORD: ${{ secrets.SMOKE_USER_A_PASSWORD }}
          SMOKE_USER_B_EMAIL: ${{ secrets.SMOKE_USER_B_EMAIL }}
          SMOKE_USER_B_PASSWORD: ${{ secrets.SMOKE_USER_B_PASSWORD }}
        run: |
          test -n "$STAGING_WEB_URL" || { echo "STAGING_WEB_URL is required"; exit 1; }
          pnpm --filter @mining/e2e exec playwright install --with-deps chromium
          pnpm --filter @mining/e2e test:cloud

      - name: Ops report (cron runs, backlog, market, connections; read-only)
        id: ops
        if: always() && steps.link.outcome == 'success'
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 -f supabase/ops/ops-report.sql

      - name: Summary (every step; partial success is not success)
        if: always()
        run: |
          {
            echo "## Staging deploy — ${STAGING_PROJECT_REF:-?} @ ${GITHUB_SHA::7}"
            echo ""
            echo "| step | outcome |"
            echo "|---|---|"
            echo "| pre-flight | ${{ steps.preflight.outcome }} |"
            echo "| guard | ${{ steps.guard.outcome }} |"
            echo "| link | ${{ steps.link.outcome }} |"
            echo "| migration history | ${{ steps.history.outcome }} |"
            echo "| migrations dry-run | ${{ steps.dryrun.outcome }} |"
            echo "| apply migrations | ${{ steps.migrate.outcome }} |"
            echo "| verify database | ${{ steps.verify.outcome }} |"
            echo "| function secrets | ${{ steps.secrets.outcome }} |"
            echo "| deploy functions | ${{ steps.functions.outcome }} |"
            echo "| API smoke | ${{ steps.smoke_api.outcome }} |"
            echo "| browser smoke | ${{ steps.smoke_web.outcome }} |"
            echo "| ops report | ${{ steps.ops.outcome }} |"
            echo ""
            echo "Overall: **${{ job.status }}** (\`skipped\` steps were not requested or did not run because an earlier step failed)."
          } >> "$GITHUB_STEP_SUMMARY"
