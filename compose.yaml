# 本地開發環境（D22）。正式環境使用 Vercel + Supabase Cloud，不使用本檔案。
#
# 前置：本機只需要 Docker Desktop、Git、編輯器。完整步驟見 README。
#
# 重點：
# - Repo 以「與宿主相同的絕對路徑」掛載（${PROJECT_ROOT}）。容器內的 Supabase CLI 會把這些路徑
#   交給宿主的 Docker 做 bind mount，路徑一致才能正確掛載 migrations 與 functions。
# - 只有 dev 與 functions 掛載 Docker socket；web 不掛載。
# - dev 與 functions 使用 host network，讓 Supabase CLI 以 127.0.0.1 連到它啟動的服務。
# - web 加入 Supabase 的網路（supabase_network_<project_id>），直接連 API gateway 容器，
#   不依賴宿主埠的綁定位址。因此要先 `supabase start` 再啟動 web。
# - Supabase 的網路由本檔案建立並設定只綁 127.0.0.1（見最下方 networks），本地 Supabase 不對區網開放。

name: mining-expedition

x-dev-base: &dev-base
  build:
    context: .
    dockerfile: Dockerfile.dev
  image: mining-expedition-dev:local
  working_dir: ${PROJECT_ROOT:-${PWD}}
  environment:
    PROJECT_ROOT: ${PROJECT_ROOT:-${PWD}}
  volumes:
    - ${PROJECT_ROOT:-${PWD}}:${PROJECT_ROOT:-${PWD}}
    - pnpm-store:/pnpm-store

services:
  # 工具容器：pnpm、Supabase CLI、驗證腳本。用 `docker compose run --rm dev <指令>` 執行
  dev:
    <<: *dev-base
    network_mode: host
    volumes:
      - ${PROJECT_ROOT:-${PWD}}:${PROJECT_ROOT:-${PWD}}
      - pnpm-store:/pnpm-store
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      PROJECT_ROOT: ${PROJECT_ROOT:-${PWD}}
      WEB_URL: http://127.0.0.1:${WEB_PORT:-3000}
      # dev 在 host network，驗證腳本直接用宿主上的埠
      VERIFY_SUPABASE_URL: http://127.0.0.1:54321
    profiles: ["tools"]

  # Next.js dev server（Hot Reload）
  web:
    <<: *dev-base
    command: ["pnpm", "--filter", "@mining/web", "dev"]
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      PROJECT_ROOT: ${PROJECT_ROOT:-${PWD}}
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-false}
    networks:
      - default
      - supabase
    restart: unless-stopped

  # 選用：Edge Functions 的 hot reload 與自訂 env（supabase start 已會提供函式）
  functions:
    <<: *dev-base
    command: ["supabase", "functions", "serve"]
    network_mode: host
    volumes:
      - ${PROJECT_ROOT:-${PWD}}:${PROJECT_ROOT:-${PWD}}
      - pnpm-store:/pnpm-store
      - /var/run/docker.sock:/var/run/docker.sock
    profiles: ["functions"]

volumes:
  pnpm-store:

networks:
  supabase:
    # 由 compose 建立（任何 `docker compose run/up` 都會先建立），`supabase start` 會沿用同名網路
    # 而不自己建立。名稱 = supabase_network_<supabase/config.toml 的 project_id>
    name: supabase_network_mining-expedition
    driver_opts:
      # 這個網路上的容器發布埠時，未指定 IP 就綁定 127.0.0.1（Supabase CLI 不指定 → 預設 0.0.0.0，區網可連）。
      # pnpm verify:env 的「埠只綁定 loopback」項目會檢查這一點。
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
